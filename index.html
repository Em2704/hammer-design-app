<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hammer Selector — bodily strain by tool</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#16202b" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Saira+Condensed:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- PHASE 1 MOCKUP: stub data only, no real recommendation logic yet. -->

  <header class="titleblock">
    <div class="tb-main">
      <h1>Hammer&nbsp;Selector</h1>
      <p class="tagline">Pick the hammer that puts the least strain on the body.</p>
    </div>
    <dl class="tb-meta">
      <div><dt>Sheet</dt><dd>01 · Strain</dd></div>
      <div><dt>Subject</dt><dd>Hammering</dd></div>
      <div><dt>Rev</dt><dd>Prototype</dd></div>
    </dl>
  </header>

  <main class="layout">
    <!-- ---------- INPUT PANEL ---------- -->
    <section class="panel" aria-label="Job specification">
      <span class="panel-tag">Job spec</span>

      <label class="field" for="task">
        <span class="field-label">Task</span>
        <select id="task" disabled>
          <option value="hammering" selected>Hammering</option>
        </select>
        <small class="hint">Only hammering has study data today. More tasks come later.</small>
      </label>

      <label class="field" for="material">
        <span class="field-label">Material struck</span>
        <select id="material">
          <option value="rubber">Rubber / soft</option>
          <option value="knob">Knob</option>
          <option value="plastic">Plastic</option>
          <option value="wood" selected>Wood</option>
          <option value="metal">Metal</option>
          <option value="concrete">Concrete / stone</option>
        </select>
      </label>

      <label class="field" for="weight">
        <span class="field-label">Hammer weight</span>
        <div class="duration-row">
          <input id="weight" type="range" min="10" max="32" step="1" value="16" />
          <output id="weightOut" class="readout">16<span class="unit">oz</span></output>
        </div>
        <small class="hint">Study measured 15, 16, 20 &amp; 22 oz. Other weights are interpolated.</small>
      </label>

      <label class="field" for="brand">
        <span class="field-label">Hammer brand <span class="optional">optional</span></span>
        <input id="brand" type="text" placeholder="e.g. Estwing" />
      </label>

      <label class="field" for="duration">
        <span class="field-label">Time on the job</span>
        <div class="duration-row">
          <input id="duration" type="range" min="5" max="120" step="5" value="30" />
          <output id="durationOut" class="readout">30<span class="unit">min</span></output>
        </div>
      </label>

      <label class="field" for="strikes">
        <span class="field-label">Strikes made <span class="optional">approx.</span></span>
        <input id="strikes" type="number" inputmode="numeric" min="0" max="9999" step="10" placeholder="e.g. 250" />
        <small class="hint">A rough count is fine. Leave blank if unknown — time on the job is used instead.</small>
      </label>

      <button id="recommendBtn" class="primary-btn" type="button">Run strain report</button>
    </section>

    <!-- ---------- RESULTS PANEL ---------- -->
    <section class="panel report" aria-label="Strain report">
      <span class="panel-tag">Strain report</span>
      <div id="disclaimer" class="disclaimer hidden"></div>
      <p id="resultsIntro" class="results-intro">
        Set the job on the left, then run the report. Lower bars mean less load on the body.
      </p>
      <ol id="resultsList" class="results-list"></ol>
    </section>
  </main>

  <footer class="app-footer">
    Prototype · stub data · not for clinical or safety decisions
  </footer>
  
  <script src="app.js"></script>
  <script>
    // Register the service worker so the app works offline and is installable.
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").catch((err) =>
          console.warn("Service worker registration failed:", err)
        );
      });
    }
  </script>
</body>
</html>
